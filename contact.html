<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Portofolio Jihan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar">
    <h1 class="logo">Portofolio</h1>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Tombol Dark Mode -->
  <button class="dark-toggle" id="darkBtn">🌙 Dark Mode</button>

  <!-- Contact Section -->
  <section class="contact">
    <h2>Contact me</h2>
    <form id="contactForm">
      <input type="text" id="name" placeholder="name">
      <input type="email" id="email" placeholder="email">
      <textarea id="message" placeholder="message"></textarea>
      <button type="submit">Send</button>
    </form>
    <p id="pesan-output"></p>
  </section>

  <script>
    const form = document.getElementById("contactForm");
    const output = document.getElementById("pesan-output");
    const darkBtn = document.getElementById("darkBtn");

    // Saat tombol Kirim ditekan
    form.addEventListener("submit", function(event) {
      event.preventDefault(); // supaya tidak reload halaman
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();

      if (name === "" || email === "" || message === "") {
        output.textContent = "Error";
        output.style.color = "red";
      } else {
        output.textContent = "The message was sent successfully";
        output.style.color = "green";
        form.reset();
      }
    });

    // Tombol Dark Mode
    darkBtn.addEventListener("click", () => {
      document.body.classList.toggle("dark-mode");
      darkBtn.textContent = document.body.classList.contains("dark-mode")
        ? "☀️ Light Mode"
        : "🌙 Dark Mode";
    });
  </script>
</body>
</html>
